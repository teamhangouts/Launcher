<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hangouts Launcher</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{color-scheme:dark light}
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;background:#0b0b0d;color:#e7e7ea;font:14px/1.4 "Geist",sans-serif}

<body>
<div id="EnclaveStatus">Booting Hangouts...</div>
<script>
const SecurityDatabaseName = "HangoutsSecurity";
const SecurityDatabaseVersion = 2;
const SecurityCredentialIterations = 250000;

// Accounts, lockout, and abuse tracking are owned by the Server now (see
// Pipeline below) — it's the only party that can actually enforce any of
// this, since a client can always clear its own IndexedDB. Local copies of
// Identities/Attempts/Flags were removed rather than kept in sync as a
// second, weaker source of truth. Keys/Device remain local because the
// private key must never leave the client.
function SecurityOpenDatabase() {
  return new Promise((resolve, reject) => {
    const SecurityRequest = indexedDB.open(SecurityDatabaseName, SecurityDatabaseVersion);
    SecurityRequest.onupgradeneeded = () => {
      const SecurityDb = SecurityRequest.result;
      for (const SecurityLegacyStoreName of ["Identities", "Attempts", "Flags"]) {
        if (SecurityDb.objectStoreNames.contains(SecurityLegacyStoreName)) {
          SecurityDb.deleteObjectStore(SecurityLegacyStoreName);
        }
      }
      if (!SecurityDb.objectStoreNames.contains("Keys")) {
        SecurityDb.createObjectStore("Keys", { keyPath: "username" });
      }
      if (!SecurityDb.objectStoreNames.contains("Device")) {
        SecurityDb.createObjectStore("Device", { keyPath: "key" });
      }
    };
    SecurityRequest.onsuccess = () => resolve(SecurityRequest.result);
    SecurityRequest.onerror = () => reject(SecurityRequest.error);
  });
}

function SecurityTransactionStore(SecurityDb, SecurityStoreName, SecurityMode) {
  return SecurityDb.transaction(SecurityStoreName, SecurityMode).objectStore(SecurityStoreName);
}

function SecurityRequestToPromise(SecurityRequest) {
  return new Promise((resolve, reject) => {
    SecurityRequest.onsuccess = () => resolve(SecurityRequest.result);
    SecurityRequest.onerror = () => reject(SecurityRequest.error);
  });
}

function SecurityRandomHex(SecurityByteLength) {
  const SecurityBytes = crypto.getRandomValues(new Uint8Array(SecurityByteLength));
  return Array.from(SecurityBytes).map((SecurityByte) => SecurityByte.toString(16).padStart(2, "0")).join("");
}

function SecurityBufferToHex(SecurityBuffer) {
  return Array.from(new Uint8Array(SecurityBuffer)).map((SecurityByte) => SecurityByte.toString(16).padStart(2, "0")).join("");
}

function SecurityHexToBuffer(SecurityHex) {
  const SecurityBytes = new Uint8Array(SecurityHex.length / 2);
  for (let SecurityIndex = 0; SecurityIndex < SecurityBytes.length; SecurityIndex++) {
    SecurityBytes[SecurityIndex] = parseInt(SecurityHex.substr(SecurityIndex * 2, 2), 16);
  }
  return SecurityBytes;
}

function SecurityNormalizeIdentifier(SecurityUsername) {
  return SecurityUsername.trim().toLowerCase();
}

async function SecurityGetDeviceId() {
  const SecurityDb = await SecurityOpenDatabase();
  const SecurityReadStore = SecurityTransactionStore(SecurityDb, "Device", "readonly");
  const SecurityExisting = await SecurityRequestToPromise(SecurityReadStore.get("deviceId"));
  if (SecurityExisting) {
    return SecurityExisting.value;
  }
  const SecurityNewId = SecurityRandomHex(32);
  const SecurityWriteDb = await SecurityOpenDatabase();
  const SecurityWriteStore = SecurityTransactionStore(SecurityWriteDb, "Device", "readwrite");
  await SecurityRequestToPromise(SecurityWriteStore.put({ key: "deviceId", value: SecurityNewId }));
  return SecurityNewId;
}

async function SecurityDeriveCredentialHash(SecurityPassword, SecuritySaltHex) {
  const SecurityEncoder = new TextEncoder();
  const SecurityKeyMaterial = await crypto.subtle.importKey(
    "raw",
    SecurityEncoder.encode(SecurityPassword),
    "PBKDF2",
    false,
    ["deriveBits"]
  );
  const SecurityDerivedBits = await crypto.subtle.deriveBits(
    {
      name: "PBKDF2",
      salt: SecurityHexToBuffer(SecuritySaltHex),
      iterations: SecurityCredentialIterations,
      hash: "SHA-256"
    },
    SecurityKeyMaterial,
    256
  );
  return SecurityBufferToHex(SecurityDerivedBits);
}

async function SecurityGenerateIdentityKeyPair() {
  const SecurityKeyPair = await crypto.subtle.generateKey(
    { name: "ECDSA", namedCurve: "P-256" },
    false,
    ["sign", "verify"]
  );
  const SecurityPublicKeyRaw = await crypto.subtle.exportKey("raw", SecurityKeyPair.publicKey);
  return {
    privateKey: SecurityKeyPair.privateKey,
    publicKeyHex: SecurityBufferToHex(SecurityPublicKeyRaw)
  };
}

async function SecurityStorePrivateKey(SecurityIdentifier, SecurityPrivateKey, SecurityStagedExpiresAt) {
  const SecurityDb = await SecurityOpenDatabase();
  const SecurityStore = SecurityTransactionStore(SecurityDb, "Keys", "readwrite");
  await SecurityRequestToPromise(
    SecurityStore.put({
      username: SecurityIdentifier,
      privateKey: SecurityPrivateKey,
      staged: Boolean(SecurityStagedExpiresAt),
      expiresAt: SecurityStagedExpiresAt || 0
    })
  );
}

async function SecurityPruneExpiredKeys() {
  const SecurityDb = await SecurityOpenDatabase();
  const SecurityStore = SecurityTransactionStore(SecurityDb, "Keys", "readwrite");
  const SecurityAll = await SecurityRequestToPromise(SecurityStore.getAll());
  const SecurityNow = Date.now();
  for (const SecurityRecord of SecurityAll) {
    if (SecurityRecord.staged && SecurityRecord.expiresAt && SecurityRecord.expiresAt <= SecurityNow) {
      const SecurityDeleteDb = await SecurityOpenDatabase();
      const SecurityDeleteStore = SecurityTransactionStore(SecurityDeleteDb, "Keys", "readwrite");
      await SecurityRequestToPromise(SecurityDeleteStore.delete(SecurityRecord.username));
    }
  }
}

async function SecurityGetPrivateKey(SecurityIdentifier) {
  const SecurityDb = await SecurityOpenDatabase();
  const SecurityStore = SecurityTransactionStore(SecurityDb, "Keys", "readonly");
  const SecurityRecord = await SecurityRequestToPromise(SecurityStore.get(SecurityIdentifier));
  return SecurityRecord ? SecurityRecord.privateKey : null;
}

async function SecurityDeleteKeyRecord(SecurityIdentifier) {
  const SecurityDb = await SecurityOpenDatabase();
  const SecurityStore = SecurityTransactionStore(SecurityDb, "Keys", "readwrite");
  await SecurityRequestToPromise(SecurityStore.delete(SecurityIdentifier));
}

const SecurityIdentityTtlMs = 30 * 60 * 1000;
const SecurityStageCooldownMs = 5000;
const SecurityProofOfWorkBits = 18;
const SecurityCacheKey = "HangoutsPendingIdentity";

function SecurityCountLeadingZeroBits(SecurityBuffer) {
  const SecurityBytes = new Uint8Array(SecurityBuffer);
  let SecurityCount = 0;
  for (const SecurityByte of SecurityBytes) {
    if (SecurityByte === 0) {
      SecurityCount += 8;
      continue;
    }
    let SecurityRemaining = SecurityByte;
    for (let SecurityBit = 7; SecurityBit >= 0; SecurityBit--) {
      if ((SecurityRemaining & (1 << SecurityBit)) !== 0) {
        break;
      }
      SecurityCount++;
    }
    break;
  }
  return SecurityCount;
}

async function SecuritySolveProofOfWork(SecurityPublicKeyHex) {
  const SecurityEncoder = new TextEncoder();
  let SecurityNonce = 0;
  while (true) {
    const SecurityCandidate = `${SecurityPublicKeyHex}:${SecurityNonce}`;
    const SecurityDigest = await crypto.subtle.digest("SHA-256", SecurityEncoder.encode(SecurityCandidate));
    if (SecurityCountLeadingZeroBits(SecurityDigest) >= SecurityProofOfWorkBits) {
      return SecurityNonce;
    }
    SecurityNonce++;
  }
}

function SecurityWriteCache(SecurityEntry) {
  localStorage.setItem(SecurityCacheKey, JSON.stringify(SecurityEntry));
}

function SecurityReadCache() {
  const SecurityRaw = localStorage.getItem(SecurityCacheKey);
  if (!SecurityRaw) {
    return null;
  }
  const SecurityEntry = JSON.parse(SecurityRaw);
  if (!SecurityEntry.expiresAt || SecurityEntry.expiresAt <= Date.now()) {
    localStorage.removeItem(SecurityCacheKey);
    return null;
  }
  return SecurityEntry;
}

function SecurityClearCache() {
  localStorage.removeItem(SecurityCacheKey);
}

async function SecurityGetLastStagedAt() {
  const SecurityDb = await SecurityOpenDatabase();
  const SecurityStore = SecurityTransactionStore(SecurityDb, "Device", "readonly");
  const SecurityRecord = await SecurityRequestToPromise(SecurityStore.get("lastStagedAt"));
  return SecurityRecord ? SecurityRecord.value : 0;
}

async function SecuritySetLastStagedAt(SecurityTimestamp) {
  const SecurityDb = await SecurityOpenDatabase();
  const SecurityStore = SecurityTransactionStore(SecurityDb, "Device", "readwrite");
  await SecurityRequestToPromise(SecurityStore.put({ key: "lastStagedAt", value: SecurityTimestamp }));
}

async function SecuritySignChallenge(SecurityPrivateKey, SecurityChallengeHex) {
  const SecuritySignature = await crypto.subtle.sign(
    { name: "ECDSA", hash: "SHA-256" },
    SecurityPrivateKey,
    SecurityHexToBuffer(SecurityChallengeHex)
  );
  return SecurityBufferToHex(SecuritySignature);
}

function SecurityCanonicalPayload(SecurityEntry) {
  return JSON.stringify({
    identityId: SecurityEntry.identityId,
    publicKeyHex: SecurityEntry.publicKeyHex,
    deviceId: SecurityEntry.deviceId,
    proofOfWorkBits: SecurityEntry.proofOfWorkBits,
    proofOfWorkNonce: SecurityEntry.proofOfWorkNonce,
    createdAt: SecurityEntry.createdAt,
    expiresAt: SecurityEntry.expiresAt
  });
}

async function SecurityDigestPayload(SecurityPayloadString) {
  const SecurityDigest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(SecurityPayloadString));
  return SecurityBufferToHex(SecurityDigest);
}

async function SecurityStageIdentity() {
  const SecurityLastStagedAt = await SecurityGetLastStagedAt();
  if (Date.now() - SecurityLastStagedAt < SecurityStageCooldownMs) {
    throw new Error("SecurityStageThrottled");
  }
  await SecurityPruneExpiredKeys();
  const SecurityIdentity = await SecurityGenerateIdentityKeyPair();
  const SecurityDeviceId = await SecurityGetDeviceId();
  const SecurityProof = await SecuritySolveProofOfWork(SecurityIdentity.publicKeyHex);
  const SecurityIdentityId = SecurityRandomHex(16);
  const SecurityExpiresAt = Date.now() + SecurityIdentityTtlMs;
  await SecurityStorePrivateKey(SecurityIdentityId, SecurityIdentity.privateKey, SecurityExpiresAt);
  const SecurityBaseEntry = {
    identityId: SecurityIdentityId,
    publicKeyHex: SecurityIdentity.publicKeyHex,
    deviceId: SecurityDeviceId,
    proofOfWorkBits: SecurityProofOfWorkBits,
    proofOfWorkNonce: SecurityProof,
    createdAt: Date.now(),
    expiresAt: SecurityExpiresAt
  };
  const SecurityChallengeHex = await SecurityDigestPayload(SecurityCanonicalPayload(SecurityBaseEntry));
  const SecuritySignatureHex = await SecuritySignChallenge(SecurityIdentity.privateKey, SecurityChallengeHex);
  const SecurityCacheEntry = { ...SecurityBaseEntry, challengeHex: SecurityChallengeHex, signatureHex: SecuritySignatureHex };
  SecurityWriteCache(SecurityCacheEntry);
  await SecuritySetLastStagedAt(Date.now());
  return SecurityCacheEntry;
}

async function SecurityVerifyCacheEntry(SecurityEntry) {
  const SecurityExpectedChallengeHex = await SecurityDigestPayload(SecurityCanonicalPayload(SecurityEntry));
  if (SecurityExpectedChallengeHex !== SecurityEntry.challengeHex) {
    return false;
  }
  const SecurityPublicKey = await crypto.subtle.importKey(
    "raw",
    SecurityHexToBuffer(SecurityEntry.publicKeyHex),
    { name: "ECDSA", namedCurve: "P-256" },
    false,
    ["verify"]
  );
  return crypto.subtle.verify(
    { name: "ECDSA", hash: "SHA-256" },
    SecurityPublicKey,
    SecurityHexToBuffer(SecurityEntry.signatureHex),
    SecurityHexToBuffer(SecurityEntry.challengeHex)
  );
}

async function SecurityEnsurePipelineConnected() {
  if (PipelineGetStatus() === "open") {
    return;
  }
  try {
    await PipelineConnect();
  } catch (SecurityConnectError) {
    const SecurityUnavailableError = new Error(`SecurityPipelineUnavailable: ${SecurityConnectError.message}`);
    SecurityUnavailableError.cause = SecurityConnectError;
    throw SecurityUnavailableError;
  }
}

async function SecurityFinalizeRegistration(SecurityIdentityId, SecurityUsername, SecurityPassword) {
  const SecurityCache = SecurityReadCache();
  if (!SecurityCache || SecurityCache.identityId !== SecurityIdentityId) {
    throw new Error("SecurityIdentityExpired");
  }
  const SecurityCacheValid = await SecurityVerifyCacheEntry(SecurityCache);
  if (!SecurityCacheValid) {
    SecurityClearCache();
    throw new Error("SecurityIdentityExpired");
  }
  const SecurityPrivateKey = await SecurityGetPrivateKey(SecurityIdentityId);
  if (!SecurityPrivateKey) {
    throw new Error("SecurityIdentityExpired");
  }

  await SecurityEnsurePipelineConnected();

  const SecurityIdentifier = SecurityNormalizeIdentifier(SecurityUsername);
  const SecurityClientSaltHex = SecurityRandomHex(16);
  const SecurityCredentialHashHex = await SecurityDeriveCredentialHash(SecurityPassword, SecurityClientSaltHex);

  // The Server independently re-verifies every field below (signature,
  // proof-of-work, expiry, honeypot, uniqueness) — nothing here is trusted
  // just because the client already checked it locally.
  const SecurityResponse = await PipelineSendRequest("auth:register", {
    username: SecurityIdentifier,
    clientSaltHex: SecurityClientSaltHex,
    credentialHashHex: SecurityCredentialHashHex,
    identityId: SecurityCache.identityId,
    publicKeyHex: SecurityCache.publicKeyHex,
    deviceId: SecurityCache.deviceId,
    proofOfWorkBits: SecurityCache.proofOfWorkBits,
    proofOfWorkNonce: SecurityCache.proofOfWorkNonce,
    createdAt: SecurityCache.createdAt,
    expiresAt: SecurityCache.expiresAt,
    challengeHex: SecurityCache.challengeHex,
    signatureHex: SecurityCache.signatureHex
  });

  await SecurityStorePrivateKey(SecurityResponse.username, SecurityPrivateKey, 0);
  await SecurityDeleteKeyRecord(SecurityIdentityId);
  SecurityClearCache();
  EnclaveAuthorizeAndRun(SecurityResponse).catch(() => {});
  return SecurityResponse;
}

async function SecurityAuthenticateAccount(SecurityUsername, SecurityPassword) {
  await SecurityEnsurePipelineConnected();

  const SecurityIdentifier = SecurityNormalizeIdentifier(SecurityUsername);
  const SecuritySaltResponse = await PipelineSendRequest("auth:salt", { username: SecurityIdentifier });
  const SecurityCredentialHashHex = await SecurityDeriveCredentialHash(SecurityPassword, SecuritySaltResponse.saltHex);

  const SecurityLoginResponse = await PipelineSendRequest("auth:login", {
    username: SecurityIdentifier,
    credentialHashHex: SecurityCredentialHashHex
  });
  EnclaveAuthorizeAndRun(SecurityLoginResponse).catch(() => {});
  return SecurityLoginResponse;
}

const PipelineHandshakeTimeoutMs = 10000;
const PipelineConnectTimeoutMs = 30000;
const PipelineRequestTimeoutMs = 15000;
const PipelineDatabaseName = "HangoutsPipeline";
const PipelineDatabaseVersion = 1;
const PipelineEndpointKeyB64 = "Pw7+ewMlr+hzZ/FzB1nwAk+hmj6SziqNjml45vUDwO8=";
const PipelineEndpointIvB64 = "aoVSfP1AfdNoYFSL";
const PipelineEndpointCipherB64 = "XWlG42cokpL814KAckAkhCPil9N32X2G9l77CgIOiGO//44DDg==";
const PipelineExpectedIdentityB64 = "";
const PipelineBackoffBaseMs = 2000;
const PipelineBackoffMaxMs = 60000;

let PipelineSocket = null;
let PipelineReconnectFailures = 0;
let PipelineLastFailureAt = 0;
let PipelineStatusValue = "disconnected";
let PipelineSessionKey = null;
let PipelineSendSeq = 0;
let PipelineRecvSeq = -1;
let PipelineSendQueue = Promise.resolve();
let PipelineRequestCounter = 0;
const PipelinePending = new Map();
const PipelineListeners = new Map();

function PipelineBase64Encode(PipelineBuffer) {
  return btoa(String.fromCharCode(...new Uint8Array(PipelineBuffer)));
}

function PipelineBase64Decode(PipelineString) {
  return Uint8Array.from(atob(PipelineString), (PipelineChar) => PipelineChar.charCodeAt(0)).buffer;
}

function PipelineConcatBytes(...PipelineArrays) {
  const PipelineTotal = PipelineArrays.reduce((PipelineSum, PipelineArray) => PipelineSum + PipelineArray.byteLength, 0);
  const PipelineOut = new Uint8Array(PipelineTotal);
  let PipelineOffset = 0;
  for (const PipelineArray of PipelineArrays) {
    PipelineOut.set(new Uint8Array(PipelineArray), PipelineOffset);
    PipelineOffset += PipelineArray.byteLength;
  }
  return PipelineOut;
}

function PipelineSeqToBytes(PipelineSeq) {
  return new Uint8Array(new Uint32Array([PipelineSeq]).buffer);
}

function PipelineOpenDatabase() {
  return new Promise((resolve, reject) => {
    const PipelineRequest = indexedDB.open(PipelineDatabaseName, PipelineDatabaseVersion);
    PipelineRequest.onupgradeneeded = () => {
      const PipelineDb = PipelineRequest.result;
      if (!PipelineDb.objectStoreNames.contains("Identity")) {
        PipelineDb.createObjectStore("Identity", { keyPath: "key" });
      }
    };
    PipelineRequest.onsuccess = () => resolve(PipelineRequest.result);
    PipelineRequest.onerror = () => reject(PipelineRequest.error);
  });
}

function PipelineRequestToPromise(PipelineRequest) {
  return new Promise((resolve, reject) => {
    PipelineRequest.onsuccess = () => resolve(PipelineRequest.result);
    PipelineRequest.onerror = () => reject(PipelineRequest.error);
  });
}

async function PipelineGetPinnedIdentity() {
  const PipelineDb = await PipelineOpenDatabase();
  const PipelineStore = PipelineDb.transaction("Identity", "readonly").objectStore("Identity");
  const PipelineRecord = await PipelineRequestToPromise(PipelineStore.get("trustedServerIdentity"));
  return PipelineRecord ? PipelineRecord.value : null;
}

async function PipelineSetPinnedIdentity(PipelineValue) {
  const PipelineDb = await PipelineOpenDatabase();
  const PipelineStore = PipelineDb.transaction("Identity", "readwrite").objectStore("Identity");
  await PipelineRequestToPromise(PipelineStore.put({ key: "trustedServerIdentity", value: PipelineValue }));
}

async function PipelineResolveEndpoint() {
  const PipelineKey = await crypto.subtle.importKey(
    "raw",
    PipelineBase64Decode(PipelineEndpointKeyB64),
    { name: "AES-GCM" },
    false,
    ["decrypt"]
  );
  const PipelinePlainBuffer = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: PipelineBase64Decode(PipelineEndpointIvB64) },
    PipelineKey,
    PipelineBase64Decode(PipelineEndpointCipherB64)
  );
  return new TextDecoder().decode(PipelinePlainBuffer);
}

function PipelineEmit(PipelineEventName, PipelinePayload) {
  const PipelineHandlers = PipelineListeners.get(PipelineEventName);
  if (!PipelineHandlers) {
    return;
  }
  for (const PipelineHandler of PipelineHandlers) {
    PipelineHandler(PipelinePayload);
  }
}

function PipelineOn(PipelineEventName, PipelineHandler) {
  if (!PipelineListeners.has(PipelineEventName)) {
    PipelineListeners.set(PipelineEventName, new Set());
  }
  PipelineListeners.get(PipelineEventName).add(PipelineHandler);
}

function PipelineOff(PipelineEventName, PipelineHandler) {
  const PipelineHandlers = PipelineListeners.get(PipelineEventName);
  if (PipelineHandlers) {
    PipelineHandlers.delete(PipelineHandler);
  }
}

function PipelineGetStatus() {
  return PipelineStatusValue;
}

function PipelineSetStatus(PipelineNewStatus) {
  PipelineStatusValue = PipelineNewStatus;
  PipelineEmit("status", { status: PipelineNewStatus });
}

async function PipelineEncryptEnvelope(PipelineObject) {
  const PipelineIv = crypto.getRandomValues(new Uint8Array(12));
  const PipelineSeq = PipelineSendSeq++;
  const PipelinePlaintext = new TextEncoder().encode(JSON.stringify(PipelineObject));
  const PipelineCiphertext = await crypto.subtle.encrypt(
    { name: "AES-GCM", iv: PipelineIv, additionalData: PipelineSeqToBytes(PipelineSeq) },
    PipelineSessionKey,
    PipelinePlaintext
  );
  return JSON.stringify({
    type: "secure",
    seq: PipelineSeq,
    iv: PipelineBase64Encode(PipelineIv),
    ct: PipelineBase64Encode(PipelineCiphertext)
  });
}

async function PipelineDecryptEnvelope(PipelineOuter) {
  if (PipelineOuter.seq <= PipelineRecvSeq) {
    throw new Error("PipelineReplayRejected");
  }
  const PipelinePlainBuffer = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: new Uint8Array(PipelineBase64Decode(PipelineOuter.iv)), additionalData: PipelineSeqToBytes(PipelineOuter.seq) },
    PipelineSessionKey,
    PipelineBase64Decode(PipelineOuter.ct)
  );
  PipelineRecvSeq = PipelineOuter.seq;
  return JSON.parse(new TextDecoder().decode(PipelinePlainBuffer));
}

function PipelineQueuedSend(PipelineObject) {
  const PipelineResult = PipelineSendQueue.then(async () => {
    PipelineSocket.send(await PipelineEncryptEnvelope(PipelineObject));
  });
  PipelineSendQueue = PipelineResult.catch(() => {});
  return PipelineResult;
}

async function PipelineSend(PipelineType, PipelinePayload) {
  if (PipelineStatusValue !== "open" || !PipelineSocket || PipelineSocket.readyState !== WebSocket.OPEN) {
    throw new Error("PipelineNotConnected");
  }
  await PipelineQueuedSend({ type: PipelineType, payload: PipelinePayload, ts: Date.now() });
}

function PipelineNextRequestId() {
  return `PipelineReq_${++PipelineRequestCounter}_${Date.now()}`;
}

function PipelineSendRequest(PipelineType, PipelinePayload, PipelineTimeoutMs = PipelineRequestTimeoutMs) {
  if (PipelineStatusValue !== "open" || !PipelineSocket || PipelineSocket.readyState !== WebSocket.OPEN) {
    return Promise.reject(new Error("PipelineNotConnected"));
  }
  const PipelineRequestId = PipelineNextRequestId();
  return new Promise((resolve, reject) => {
    const PipelineTimer = setTimeout(() => {
      PipelinePending.delete(PipelineRequestId);
      reject(new Error("PipelineRequestTimeout"));
    }, PipelineTimeoutMs);
    PipelinePending.set(PipelineRequestId, { resolve, reject, timer: PipelineTimer });
    PipelineQueuedSend({ type: PipelineType, payload: PipelinePayload, requestId: PipelineRequestId, ts: Date.now() }).catch((PipelineError) => {
      clearTimeout(PipelineTimer);
      PipelinePending.delete(PipelineRequestId);
      reject(PipelineError);
    });
  });
}

async function PipelineHandleMessage(PipelineEvent) {
  let PipelineOuter;
  try {
    PipelineOuter = JSON.parse(PipelineEvent.data);
  } catch {
    return;
  }
  if (PipelineOuter.type !== "secure") {
    return;
  }
  let PipelineMessage;
  try {
    PipelineMessage = await PipelineDecryptEnvelope(PipelineOuter);
  } catch {
    return;
  }
  if (PipelineMessage.requestId && PipelinePending.has(PipelineMessage.requestId)) {
    const { resolve, reject, timer } = PipelinePending.get(PipelineMessage.requestId);
    clearTimeout(timer);
    PipelinePending.delete(PipelineMessage.requestId);
    if (PipelineMessage.error) {
      const PipelineErrorObject = new Error(PipelineMessage.error);
      if (PipelineMessage.errorCode) {
        PipelineErrorObject.code = PipelineMessage.errorCode;
      }
      if (typeof PipelineMessage.retryAfterMs === "number") {
        PipelineErrorObject.retryAfterMs = PipelineMessage.retryAfterMs;
      }
      reject(PipelineErrorObject);
    } else {
      resolve(PipelineMessage.payload);
    }
    return;
  }
  PipelineEmit(`message:${PipelineMessage.type}`, PipelineMessage.payload);
}

async function PipelinePerformHandshake(PipelineActiveSocket) {
  const PipelineEphemeral = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveBits"]);
  const PipelineClientEphemeralRaw = await crypto.subtle.exportKey("raw", PipelineEphemeral.publicKey);

  const PipelineResponse = await new Promise((resolve, reject) => {
    const PipelineTimer = setTimeout(() => {
      PipelineActiveSocket.removeEventListener("message", PipelineOnMessage);
      reject(new Error("PipelineHandshakeTimeout"));
    }, PipelineHandshakeTimeoutMs);
    function PipelineOnMessage(PipelineEvent) {
      let PipelineMessage;
      try {
        PipelineMessage = JSON.parse(PipelineEvent.data);
      } catch {
        return;
      }
      if (PipelineMessage.type !== "handshake:response") {
        return;
      }
      clearTimeout(PipelineTimer);
      PipelineActiveSocket.removeEventListener("message", PipelineOnMessage);
      resolve(PipelineMessage);
    }
    PipelineActiveSocket.addEventListener("message", PipelineOnMessage);
    PipelineActiveSocket.send(JSON.stringify({
      type: "handshake:init",
      clientEphemeralPublicKey: PipelineBase64Encode(PipelineClientEphemeralRaw)
    }));
  });

  const PipelineServerEphemeralRaw = PipelineBase64Decode(PipelineResponse.serverEphemeralPublicKey);
  const PipelineNonce = new Uint8Array(PipelineBase64Decode(PipelineResponse.nonce));
  const PipelineSignedBlob = PipelineConcatBytes(PipelineClientEphemeralRaw, PipelineServerEphemeralRaw, PipelineNonce);

  if (PipelineExpectedIdentityB64) {
    if (PipelineResponse.serverLongTermPublicKey !== PipelineExpectedIdentityB64) {
      throw new Error("PipelineServerIdentityMismatch");
    }
  } else {
    const PipelinePinned = await PipelineGetPinnedIdentity();
    if (PipelinePinned && PipelinePinned !== PipelineResponse.serverLongTermPublicKey) {
      throw new Error("PipelineServerIdentityMismatch");
    }
  }

  const PipelineServerIdentityKey = await crypto.subtle.importKey(
    "raw",
    PipelineBase64Decode(PipelineResponse.serverLongTermPublicKey),
    { name: "ECDSA", namedCurve: "P-256" },
    true,
    ["verify"]
  );
  const PipelineSignatureValid = await crypto.subtle.verify(
    { name: "ECDSA", hash: "SHA-256" },
    PipelineServerIdentityKey,
    PipelineBase64Decode(PipelineResponse.signature),
    PipelineSignedBlob
  );
  if (!PipelineSignatureValid) {
    throw new Error("PipelineHandshakeSignatureInvalid");
  }

  if (!PipelineExpectedIdentityB64) {
    const PipelinePinned = await PipelineGetPinnedIdentity();
    if (!PipelinePinned) {
      await PipelineSetPinnedIdentity(PipelineResponse.serverLongTermPublicKey);
    }
  }

  const PipelineServerEphemeralPublicKey = await crypto.subtle.importKey(
    "raw",
    PipelineServerEphemeralRaw,
    { name: "ECDH", namedCurve: "P-256" },
    true,
    []
  );
  const PipelineSharedBits = await crypto.subtle.deriveBits(
    { name: "ECDH", public: PipelineServerEphemeralPublicKey },
    PipelineEphemeral.privateKey,
    256
  );
  const PipelineHkdfKey = await crypto.subtle.importKey("raw", PipelineSharedBits, "HKDF", false, ["deriveKey"]);
  PipelineSessionKey = await crypto.subtle.deriveKey(
    { name: "HKDF", hash: "SHA-256", salt: PipelineNonce, info: new TextEncoder().encode("hangouts-pipeline-v1") },
    PipelineHkdfKey,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
  PipelineSendSeq = 0;
  PipelineRecvSeq = -1;
  PipelineSendQueue = Promise.resolve();
}

function PipelineBackoffRemainingMs() {
  if (PipelineReconnectFailures === 0) {
    return 0;
  }
  const PipelineBackoff = Math.min(PipelineBackoffBaseMs * Math.pow(2, PipelineReconnectFailures - 1), PipelineBackoffMaxMs);
  return Math.max(0, PipelineBackoff - (Date.now() - PipelineLastFailureAt));
}

function PipelineRecordFailure() {
  PipelineReconnectFailures++;
  PipelineLastFailureAt = Date.now();
}

function PipelineRecordSuccess() {
  PipelineReconnectFailures = 0;
  PipelineLastFailureAt = 0;
}

function PipelineConnect() {
  if (PipelineStatusValue === "connecting" || PipelineStatusValue === "open") {
    return Promise.resolve();
  }
  if (PipelineBackoffRemainingMs() > 0) {
    return Promise.reject(new Error("PipelineBackoffActive"));
  }
  PipelineSetStatus("connecting");
  return PipelineResolveEndpoint().then((PipelineUrl) => new Promise((resolve, reject) => {
    let PipelineSettled = false;
    const PipelineActiveSocket = new WebSocket(PipelineUrl);
    const PipelineTimeoutTimer = setTimeout(() => {
      if (PipelineSettled) {
        return;
      }
      PipelineSettled = true;
      try {
        PipelineActiveSocket.close();
      } catch {}
      PipelineRecordFailure();
      PipelineSetStatus("disconnected");
      reject(new Error("PipelineConnectTimeout"));
    }, PipelineConnectTimeoutMs);

    PipelineActiveSocket.onopen = async () => {
      if (PipelineSettled) {
        return;
      }
      try {
        await PipelinePerformHandshake(PipelineActiveSocket);
      } catch (PipelineError) {
        if (PipelineSettled) {
          return;
        }
        PipelineSettled = true;
        clearTimeout(PipelineTimeoutTimer);
        try {
          PipelineActiveSocket.close();
        } catch {}
        PipelineRecordFailure();
        PipelineSetStatus("disconnected");
        reject(PipelineError);
        return;
      }
      if (PipelineSettled) {
        return;
      }
      PipelineSettled = true;
      clearTimeout(PipelineTimeoutTimer);
      PipelineSocket = PipelineActiveSocket;
      PipelineRecordSuccess();
      PipelineSetStatus("open");
      resolve();
    };
    PipelineActiveSocket.onmessage = PipelineHandleMessage;
    PipelineActiveSocket.onclose = PipelineActiveSocket.onerror = (PipelineEvent) => {
      const PipelineBanned = Boolean(PipelineEvent && PipelineEvent.code === 4003);
      if (!PipelineSettled) {
        PipelineSettled = true;
        clearTimeout(PipelineTimeoutTimer);
        PipelineRecordFailure();
        PipelineSetStatus("disconnected");
        reject(new Error(PipelineBanned ? "PipelineBanned" : "PipelineConnectError"));
        return;
      }
      if (PipelineStatusValue === "open") {
        PipelineSessionKey = null;
        PipelineSendSeq = 0;
        PipelineRecvSeq = -1;
        PipelineSendQueue = Promise.resolve();
        PipelineRecordFailure();
        PipelineSetStatus("disconnected");
        PipelineEmit("disconnected", { banned: PipelineBanned });
        for (const [, PipelinePendingEntry] of PipelinePending) {
          clearTimeout(PipelinePendingEntry.timer);
          PipelinePendingEntry.reject(new Error(PipelineBanned ? "PipelineBanned" : "PipelineDisconnected"));
        }
        PipelinePending.clear();
      }
    };
  }));
}

const EnclaveRepo = "teamhangouts/Hangouts";
const EnclaveAssetsRepo = "teamhangouts/Assets";
const EnclaveBranch = "main";
const EnclaveCdnHost = "https://cdn.jsdelivr.net/gh";
const EnclaveManifestPath = "Releases/Latest.txt";
const EnclavePublicKeyB64 = "BG3meGouQKGYoMpgnSxK+8/iG7vVgLchFzHZr3nScImbMYrb0wM3uZqgo4HzBXi5v3oJvs1PciNTA8eaJQK90I4=";
const EnclaveFontFamily = "Geist";
const EnclaveFontPath = "Fonts/Geist/Variable.woff2";
const EnclaveFontWeightRange = "100 900";

function EnclaveBaseUrl() {
  return `${EnclaveCdnHost}/${EnclaveRepo}@${EnclaveBranch}/`;
}

function EnclaveAssetsBaseUrl() {
  return `${EnclaveCdnHost}/${EnclaveAssetsRepo}@${EnclaveBranch}/`;
}

function EnclaveFontUrl() {
  return EnclaveAssetsBaseUrl() + EnclaveFontPath;
}

async function EnclaveLoadFonts() {
  try {
    const EnclaveFont = new FontFace(EnclaveFontFamily, `url(${EnclaveFontUrl()})`, { weight: EnclaveFontWeightRange });
    const EnclaveLoadedFont = await EnclaveFont.load();
    document.fonts.add(EnclaveLoadedFont);
  } catch {}
}

function EnclaveManifestUrl() {
  return EnclaveBaseUrl() + EnclaveManifestPath;
}

function EnclaveReleaseUrl(EnclaveReleasePath) {
  return EnclaveBaseUrl() + EnclaveReleasePath;
}

function EnclaveBase64Decode(EnclaveString) {
  return Uint8Array.from(atob(EnclaveString), (EnclaveChar) => EnclaveChar.charCodeAt(0)).buffer;
}

const EnclaveErrorNoNetwork = "E1";
const EnclaveErrorManifestUnreachable = "E2";
const EnclaveErrorManifestMalformed = "E3";
const EnclaveErrorReleaseUnreachable = "E4";
const EnclaveErrorReleaseUnsigned = "E5";
const EnclaveErrorUnauthorized = "E6";

function EnclaveTaggedError(EnclaveCode, EnclaveMessage) {
  const EnclaveError = new Error(EnclaveMessage);
  EnclaveError.code = EnclaveCode;
  return EnclaveError;
}

function EnclaveIsOffline() {
  return typeof navigator !== "undefined" && navigator.onLine === false;
}

async function EnclaveFetchText(EnclaveUrl, EnclaveUnreachableCode, EnclaveUnreachableMessage) {
  let EnclaveResponse;
  try {
    EnclaveResponse = await fetch(EnclaveUrl, { cache: "no-store" });
  } catch {
    throw EnclaveIsOffline()
      ? EnclaveTaggedError(EnclaveErrorNoNetwork, "No network connection detected.")
      : EnclaveTaggedError(EnclaveUnreachableCode, EnclaveUnreachableMessage);
  }
  if (!EnclaveResponse.ok) {
    throw EnclaveIsOffline()
      ? EnclaveTaggedError(EnclaveErrorNoNetwork, "No network connection detected.")
      : EnclaveTaggedError(EnclaveUnreachableCode, EnclaveUnreachableMessage);
  }
  return EnclaveResponse.text();
}

async function EnclaveFetchManifest() {
  const EnclaveManifestRaw = await EnclaveFetchText(
    EnclaveManifestUrl(),
    EnclaveErrorManifestUnreachable,
    "Could not reach the Hangouts release manifest."
  );
  const EnclaveManifestLines = EnclaveManifestRaw.trim().split("\n").map((EnclaveLine) => EnclaveLine.trim());
  const EnclaveReleasePath = EnclaveManifestLines[0];
  const EnclaveSignatureB64 = EnclaveManifestLines[1];
  if (!EnclaveReleasePath || !EnclaveSignatureB64) {
    throw EnclaveTaggedError(EnclaveErrorManifestMalformed, "The Hangouts release manifest is malformed.");
  }
  return { releasePath: EnclaveReleasePath, signatureB64: EnclaveSignatureB64 };
}

async function EnclaveFetchRelease(EnclaveReleasePath) {
  return EnclaveFetchText(
    EnclaveReleaseUrl(EnclaveReleasePath),
    EnclaveErrorReleaseUnreachable,
    "Could not download the Hangouts release."
  );
}

async function EnclaveVerifyRelease(EnclaveHtml, EnclaveSignatureB64) {
  const EnclavePublicKey = await crypto.subtle.importKey(
    "raw",
    EnclaveBase64Decode(EnclavePublicKeyB64),
    { name: "ECDSA", namedCurve: "P-256" },
    false,
    ["verify"]
  );
  return crypto.subtle.verify(
    { name: "ECDSA", hash: "SHA-256" },
    EnclavePublicKey,
    EnclaveBase64Decode(EnclaveSignatureB64),
    new TextEncoder().encode(EnclaveHtml)
  );
}

function EnclaveSetStatus(EnclaveMessage, EnclaveIsError) {
  const EnclaveStatusNode = document.getElementById("EnclaveStatus");
  EnclaveStatusNode.textContent = EnclaveMessage;
  EnclaveStatusNode.classList.toggle("EnclaveStatusError", Boolean(EnclaveIsError));
}

const EnclaveDownloadFileName = "Hangouts.html";

function EnclaveTriggerDownload(EnclaveHtml, EnclaveFileName) {
  const EnclaveBlob = new Blob([EnclaveHtml], { type: "text/html" });
  const EnclaveObjectUrl = URL.createObjectURL(EnclaveBlob);
  const EnclaveAnchor = document.createElement("a");
  EnclaveAnchor.href = EnclaveObjectUrl;
  EnclaveAnchor.download = EnclaveFileName;
  document.body.appendChild(EnclaveAnchor);
  EnclaveAnchor.click();
  EnclaveAnchor.remove();
  URL.revokeObjectURL(EnclaveObjectUrl);
}

let EnclaveAuthorizedSession = null;

function EnclaveIsAuthorized() {
  return Boolean(EnclaveAuthorizedSession);
}

// Security is the only caller allowed to unlock Enclave — a verified,
// server-confirmed account (fresh registration or login) is the gate, not
// just "a form was submitted." This is what keeps an anonymous visitor from
// spinning up free CDN egress against the release manifest/asset repos.
async function EnclaveAuthorizeAndRun(SecuritySession) {
  if (!SecuritySession || !SecuritySession.username) {
    throw new Error("EnclaveUnauthorized");
  }
  EnclaveAuthorizedSession = SecuritySession;
  await EnclaveRun();
}

async function EnclaveRun() {
  if (!EnclaveIsAuthorized()) {
    EnclaveSetStatus(`${EnclaveErrorUnauthorized}: Sign in to a Hangouts account to continue.`, true);
    return;
  }
  try {
    EnclaveSetStatus("Locating latest release...");
    const EnclaveManifest = await EnclaveFetchManifest();
    EnclaveSetStatus("Downloading Hangouts...");
    const EnclaveHtml = await EnclaveFetchRelease(EnclaveManifest.releasePath);
    EnclaveSetStatus("Verifying release...");
    const EnclaveVerified = await EnclaveVerifyRelease(EnclaveHtml, EnclaveManifest.signatureB64);
    if (!EnclaveVerified) {
      throw EnclaveTaggedError(EnclaveErrorReleaseUnsigned, "The Hangouts release signature could not be verified.");
    }
    EnclaveTriggerDownload(EnclaveHtml, EnclaveDownloadFileName);
    EnclaveSetStatus(`${EnclaveDownloadFileName} downloaded — open it from your downloads to launch Hangouts.`);
  } catch (EnclaveError) {
    const EnclaveCode = EnclaveError && EnclaveError.code ? EnclaveError.code : EnclaveErrorManifestUnreachable;
    const EnclaveMessage = EnclaveError && EnclaveError.message ? EnclaveError.message : "Could not reach Hangouts.";
    EnclaveSetStatus(`${EnclaveCode}: ${EnclaveMessage}`, true);
  }
}

EnclaveLoadFonts();
EnclaveSetStatus(`${EnclaveErrorUnauthorized}: Sign in to a Hangouts account to continue.`, true);
</script>
