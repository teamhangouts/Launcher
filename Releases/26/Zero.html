<script>
const SecurityDatabaseName = "HangoutsSecurity";
const SecurityDatabaseVersion = 1;
const SecurityCredentialIterations = 250000;
const SecurityLockoutWindowMs = 15 * 60 * 1000;
const SecurityLockoutThreshold = 5;
const SecurityLockoutBaseMs = 30 * 1000;

function SecurityOpenDatabase() {
  return new Promise((resolve, reject) => {
    const SecurityRequest = indexedDB.open(SecurityDatabaseName, SecurityDatabaseVersion);
    SecurityRequest.onupgradeneeded = () => {
      const SecurityDb = SecurityRequest.result;
      if (!SecurityDb.objectStoreNames.contains("Identities")) {
        SecurityDb.createObjectStore("Identities", { keyPath: "username" });
      }
      if (!SecurityDb.objectStoreNames.contains("Keys")) {
        SecurityDb.createObjectStore("Keys", { keyPath: "username" });
      }
      if (!SecurityDb.objectStoreNames.contains("Attempts")) {
        const SecurityAttemptsStore = SecurityDb.createObjectStore("Attempts", { keyPath: "id", autoIncrement: true });
        SecurityAttemptsStore.createIndex("byIdentifier", "identifier");
      }
      if (!SecurityDb.objectStoreNames.contains("Flags")) {
        SecurityDb.createObjectStore("Flags", { keyPath: "identifier" });
      }
      if (!SecurityDb.objectStoreNames.contains("Device")) {
        SecurityDb.createObjectStore("Device", { keyPath: "key" });
      }
    };
    SecurityRequest.onsuccess = () => resolve(SecurityRequest.result);
    SecurityRequest.onerror = () => reject(SecurityRequest.error);
  });
}

function SecurityTransactionStore(SecurityDb, SecurityStoreName, SecurityMode) {
  return SecurityDb.transaction(SecurityStoreName, SecurityMode).objectStore(SecurityStoreName);
}

function SecurityRequestToPromise(SecurityRequest) {
  return new Promise((resolve, reject) => {
    SecurityRequest.onsuccess = () => resolve(SecurityRequest.result);
    SecurityRequest.onerror = () => reject(SecurityRequest.error);
  });
}

function SecurityRandomHex(SecurityByteLength) {
  const SecurityBytes = crypto.getRandomValues(new Uint8Array(SecurityByteLength));
  return Array.from(SecurityBytes).map((SecurityByte) => SecurityByte.toString(16).padStart(2, "0")).join("");
}

function SecurityBufferToHex(SecurityBuffer) {
  return Array.from(new Uint8Array(SecurityBuffer)).map((SecurityByte) => SecurityByte.toString(16).padStart(2, "0")).join("");
}

function SecurityHexToBuffer(SecurityHex) {
  const SecurityBytes = new Uint8Array(SecurityHex.length / 2);
  for (let SecurityIndex = 0; SecurityIndex < SecurityBytes.length; SecurityIndex++) {
    SecurityBytes[SecurityIndex] = parseInt(SecurityHex.substr(SecurityIndex * 2, 2), 16);
  }
  return SecurityBytes;
}

function SecurityConstantTimeEqual(SecurityA, SecurityB) {
  if (SecurityA.length !== SecurityB.length) {
    return false;
  }
  let SecurityDiff = 0;
  for (let SecurityIndex = 0; SecurityIndex < SecurityA.length; SecurityIndex++) {
    SecurityDiff |= SecurityA.charCodeAt(SecurityIndex) ^ SecurityB.charCodeAt(SecurityIndex);
  }
  return SecurityDiff === 0;
}

function SecurityNormalizeIdentifier(SecurityUsername) {
  return SecurityUsername.trim().toLowerCase();
}

async function SecurityGetDeviceId() {
  const SecurityDb = await SecurityOpenDatabase();
  const SecurityReadStore = SecurityTransactionStore(SecurityDb, "Device", "readonly");
  const SecurityExisting = await SecurityRequestToPromise(SecurityReadStore.get("deviceId"));
  if (SecurityExisting) {
    return SecurityExisting.value;
  }
  const SecurityNewId = SecurityRandomHex(32);
  const SecurityWriteDb = await SecurityOpenDatabase();
  const SecurityWriteStore = SecurityTransactionStore(SecurityWriteDb, "Device", "readwrite");
  await SecurityRequestToPromise(SecurityWriteStore.put({ key: "deviceId", value: SecurityNewId }));
  return SecurityNewId;
}

async function SecurityDeriveCredentialHash(SecurityPassword, SecuritySaltHex) {
  const SecurityEncoder = new TextEncoder();
  const SecurityKeyMaterial = await crypto.subtle.importKey(
    "raw",
    SecurityEncoder.encode(SecurityPassword),
    "PBKDF2",
    false,
    ["deriveBits"]
  );
  const SecurityDerivedBits = await crypto.subtle.deriveBits(
    {
      name: "PBKDF2",
      salt: SecurityHexToBuffer(SecuritySaltHex),
      iterations: SecurityCredentialIterations,
      hash: "SHA-256"
    },
    SecurityKeyMaterial,
    256
  );
  return SecurityBufferToHex(SecurityDerivedBits);
}

async function SecurityGenerateIdentityKeyPair() {
  const SecurityKeyPair = await crypto.subtle.generateKey(
    { name: "ECDSA", namedCurve: "P-256" },
    false,
    ["sign", "verify"]
  );
  const SecurityPublicKeyRaw = await crypto.subtle.exportKey("raw", SecurityKeyPair.publicKey);
  return {
    privateKey: SecurityKeyPair.privateKey,
    publicKeyHex: SecurityBufferToHex(SecurityPublicKeyRaw)
  };
}

async function SecurityStorePrivateKey(SecurityIdentifier, SecurityPrivateKey, SecurityStagedExpiresAt) {
  const SecurityDb = await SecurityOpenDatabase();
  const SecurityStore = SecurityTransactionStore(SecurityDb, "Keys", "readwrite");
  await SecurityRequestToPromise(
    SecurityStore.put({
      username: SecurityIdentifier,
      privateKey: SecurityPrivateKey,
      staged: Boolean(SecurityStagedExpiresAt),
      expiresAt: SecurityStagedExpiresAt || 0
    })
  );
}

async function SecurityPruneExpiredKeys() {
  const SecurityDb = await SecurityOpenDatabase();
  const SecurityStore = SecurityTransactionStore(SecurityDb, "Keys", "readwrite");
  const SecurityAll = await SecurityRequestToPromise(SecurityStore.getAll());
  const SecurityNow = Date.now();
  for (const SecurityRecord of SecurityAll) {
    if (SecurityRecord.staged && SecurityRecord.expiresAt && SecurityRecord.expiresAt <= SecurityNow) {
      const SecurityDeleteDb = await SecurityOpenDatabase();
      const SecurityDeleteStore = SecurityTransactionStore(SecurityDeleteDb, "Keys", "readwrite");
      await SecurityRequestToPromise(SecurityDeleteStore.delete(SecurityRecord.username));
    }
  }
}

async function SecurityGetPrivateKey(SecurityIdentifier) {
  const SecurityDb = await SecurityOpenDatabase();
  const SecurityStore = SecurityTransactionStore(SecurityDb, "Keys", "readonly");
  const SecurityRecord = await SecurityRequestToPromise(SecurityStore.get(SecurityIdentifier));
  return SecurityRecord ? SecurityRecord.privateKey : null;
}

async function SecurityRecordAttempt(SecurityIdentifier, SecuritySucceeded) {
  const SecurityDb = await SecurityOpenDatabase();
  const SecurityStore = SecurityTransactionStore(SecurityDb, "Attempts", "readwrite");
  await SecurityRequestToPromise(
    SecurityStore.add({
      identifier: SecurityIdentifier,
      succeeded: SecuritySucceeded,
      timestamp: Date.now()
    })
  );
}

async function SecurityRecentFailureCount(SecurityIdentifier) {
  const SecurityDb = await SecurityOpenDatabase();
  const SecurityStore = SecurityTransactionStore(SecurityDb, "Attempts", "readonly");
  const SecurityIndex = SecurityStore.index("byIdentifier");
  const SecurityAll = await SecurityRequestToPromise(SecurityIndex.getAll(SecurityIdentifier));
  const SecurityWindowStart = Date.now() - SecurityLockoutWindowMs;
  return SecurityAll.filter(
    (SecurityEntry) => !SecurityEntry.succeeded && SecurityEntry.timestamp >= SecurityWindowStart
  ).length;
}

async function SecurityGetFlag(SecurityIdentifier) {
  const SecurityDb = await SecurityOpenDatabase();
  const SecurityStore = SecurityTransactionStore(SecurityDb, "Flags", "readonly");
  return SecurityRequestToPromise(SecurityStore.get(SecurityIdentifier));
}

async function SecuritySetFlag(SecurityIdentifier, SecurityFlag) {
  const SecurityDb = await SecurityOpenDatabase();
  const SecurityStore = SecurityTransactionStore(SecurityDb, "Flags", "readwrite");
  await SecurityRequestToPromise(SecurityStore.put({ identifier: SecurityIdentifier, ...SecurityFlag }));
}

async function SecurityIsLocked(SecurityIdentifier) {
  const SecurityFlag = await SecurityGetFlag(SecurityIdentifier);
  if (!SecurityFlag || !SecurityFlag.lockedUntil) {
    return false;
  }
  return SecurityFlag.lockedUntil > Date.now();
}

async function SecurityEvaluateAbuse(SecurityIdentifier) {
  const SecurityFailureCount = await SecurityRecentFailureCount(SecurityIdentifier);
  if (SecurityFailureCount < SecurityLockoutThreshold) {
    await SecuritySetFlag(SecurityIdentifier, { level: "Watched", lockedUntil: 0, failureCount: SecurityFailureCount });
    return { level: "Watched", failureCount: SecurityFailureCount };
  }
  const SecurityExcess = SecurityFailureCount - SecurityLockoutThreshold;
  const SecurityLockMs = SecurityLockoutBaseMs * Math.pow(2, SecurityExcess);
  const SecurityLockedUntil = Date.now() + SecurityLockMs;
  await SecuritySetFlag(SecurityIdentifier, { level: "Locked", lockedUntil: SecurityLockedUntil, failureCount: SecurityFailureCount });
  return { level: "Locked", failureCount: SecurityFailureCount, lockedUntil: SecurityLockedUntil };
}

const SecurityIdentityTtlMs = 30 * 60 * 1000;
const SecurityStageCooldownMs = 5000;
const SecurityProofOfWorkBits = 18;
const SecurityCacheKey = "HangoutsPendingIdentity";
const SecurityHoneypotIdentifiers = new Set(["admin", "root", "test", "administrator", "moderator", "support"]);
const SecurityDummySaltHex = "00000000000000000000000000000000";

function SecurityCountLeadingZeroBits(SecurityBuffer) {
  const SecurityBytes = new Uint8Array(SecurityBuffer);
  let SecurityCount = 0;
  for (const SecurityByte of SecurityBytes) {
    if (SecurityByte === 0) {
      SecurityCount += 8;
      continue;
    }
    let SecurityRemaining = SecurityByte;
    for (let SecurityBit = 7; SecurityBit >= 0; SecurityBit--) {
      if ((SecurityRemaining & (1 << SecurityBit)) !== 0) {
        break;
      }
      SecurityCount++;
    }
    break;
  }
  return SecurityCount;
}

async function SecuritySolveProofOfWork(SecurityPublicKeyHex) {
  const SecurityEncoder = new TextEncoder();
  let SecurityNonce = 0;
  while (true) {
    const SecurityCandidate = `${SecurityPublicKeyHex}:${SecurityNonce}`;
    const SecurityDigest = await crypto.subtle.digest("SHA-256", SecurityEncoder.encode(SecurityCandidate));
    if (SecurityCountLeadingZeroBits(SecurityDigest) >= SecurityProofOfWorkBits) {
      return SecurityNonce;
    }
    SecurityNonce++;
  }
}

function SecurityWriteCache(SecurityEntry) {
  localStorage.setItem(SecurityCacheKey, JSON.stringify(SecurityEntry));
}

function SecurityReadCache() {
  const SecurityRaw = localStorage.getItem(SecurityCacheKey);
  if (!SecurityRaw) {
    return null;
  }
  const SecurityEntry = JSON.parse(SecurityRaw);
  if (!SecurityEntry.expiresAt || SecurityEntry.expiresAt <= Date.now()) {
    localStorage.removeItem(SecurityCacheKey);
    return null;
  }
  return SecurityEntry;
}

function SecurityClearCache() {
  localStorage.removeItem(SecurityCacheKey);
}

async function SecurityFlagHoneypot(SecurityIdentifier, SecurityDeviceId) {
  await SecuritySetFlag(`${SecurityIdentifier}:${SecurityDeviceId}`, {
    level: "Locked",
    lockedUntil: Date.now() + SecurityLockoutWindowMs * 96,
    failureCount: SecurityLockoutThreshold
  });
}

async function SecurityGetLastStagedAt() {
  const SecurityDb = await SecurityOpenDatabase();
  const SecurityStore = SecurityTransactionStore(SecurityDb, "Device", "readonly");
  const SecurityRecord = await SecurityRequestToPromise(SecurityStore.get("lastStagedAt"));
  return SecurityRecord ? SecurityRecord.value : 0;
}

async function SecuritySetLastStagedAt(SecurityTimestamp) {
  const SecurityDb = await SecurityOpenDatabase();
  const SecurityStore = SecurityTransactionStore(SecurityDb, "Device", "readwrite");
  await SecurityRequestToPromise(SecurityStore.put({ key: "lastStagedAt", value: SecurityTimestamp }));
}

async function SecuritySignChallenge(SecurityPrivateKey, SecurityChallengeHex) {
  const SecuritySignature = await crypto.subtle.sign(
    { name: "ECDSA", hash: "SHA-256" },
    SecurityPrivateKey,
    SecurityHexToBuffer(SecurityChallengeHex)
  );
  return SecurityBufferToHex(SecuritySignature);
}

async function SecurityStageIdentity() {
  const SecurityLastStagedAt = await SecurityGetLastStagedAt();
  if (Date.now() - SecurityLastStagedAt < SecurityStageCooldownMs) {
    throw new Error("SecurityStageThrottled");
  }
  await SecurityPruneExpiredKeys();
  const SecurityIdentity = await SecurityGenerateIdentityKeyPair();
  const SecurityDeviceId = await SecurityGetDeviceId();
  const SecurityProof = await SecuritySolveProofOfWork(SecurityIdentity.publicKeyHex);
  const SecurityIdentityId = SecurityRandomHex(16);
  const SecurityExpiresAt = Date.now() + SecurityIdentityTtlMs;
  await SecurityStorePrivateKey(SecurityIdentityId, SecurityIdentity.privateKey, SecurityExpiresAt);
  const SecurityChallengeHex = SecurityRandomHex(32);
  const SecuritySignatureHex = await SecuritySignChallenge(SecurityIdentity.privateKey, SecurityChallengeHex);
  const SecurityCacheEntry = {
    identityId: SecurityIdentityId,
    publicKeyHex: SecurityIdentity.publicKeyHex,
    deviceId: SecurityDeviceId,
    proofOfWorkBits: SecurityProofOfWorkBits,
    proofOfWorkNonce: SecurityProof,
    challengeHex: SecurityChallengeHex,
    signatureHex: SecuritySignatureHex,
    createdAt: Date.now(),
    expiresAt: SecurityExpiresAt
  };
  SecurityWriteCache(SecurityCacheEntry);
  await SecuritySetLastStagedAt(Date.now());
  return SecurityCacheEntry;
}

async function SecurityVerifyCacheEntry(SecurityEntry) {
  const SecurityPublicKey = await crypto.subtle.importKey(
    "raw",
    SecurityHexToBuffer(SecurityEntry.publicKeyHex),
    { name: "ECDSA", namedCurve: "P-256" },
    false,
    ["verify"]
  );
  return crypto.subtle.verify(
    { name: "ECDSA", hash: "SHA-256" },
    SecurityPublicKey,
    SecurityHexToBuffer(SecurityEntry.signatureHex),
    SecurityHexToBuffer(SecurityEntry.challengeHex)
  );
}

async function SecurityFinalizeRegistration(SecurityIdentityId, SecurityUsername, SecurityPassword) {
  const SecurityIdentifier = SecurityNormalizeIdentifier(SecurityUsername);
  if (SecurityHoneypotIdentifiers.has(SecurityIdentifier)) {
    const SecurityDeviceId = await SecurityGetDeviceId();
    await SecurityFlagHoneypot(SecurityIdentifier, SecurityDeviceId);
    throw new Error("SecurityInvalidCredentials");
  }
  if (await SecurityIsLocked(SecurityIdentifier)) {
    throw new Error("SecurityIdentifierLocked");
  }
  const SecurityPrivateKey = await SecurityGetPrivateKey(SecurityIdentityId);
  if (!SecurityPrivateKey) {
    throw new Error("SecurityIdentityExpired");
  }
  const SecurityDb = await SecurityOpenDatabase();
  const SecurityReadStore = SecurityTransactionStore(SecurityDb, "Identities", "readonly");
  const SecurityExisting = await SecurityRequestToPromise(SecurityReadStore.get(SecurityIdentifier));
  if (SecurityExisting) {
    throw new Error("SecurityIdentifierTaken");
  }
  const SecuritySaltHex = SecurityRandomHex(16);
  const SecurityCredentialHash = await SecurityDeriveCredentialHash(SecurityPassword, SecuritySaltHex);
  const SecurityDeviceId = await SecurityGetDeviceId();
  const SecurityWriteDb = await SecurityOpenDatabase();
  const SecurityWriteStore = SecurityTransactionStore(SecurityWriteDb, "Identities", "readwrite");
  await SecurityRequestToPromise(
    SecurityWriteStore.add({
      username: SecurityIdentifier,
      saltHex: SecuritySaltHex,
      credentialHash: SecurityCredentialHash,
      deviceId: SecurityDeviceId,
      identityId: SecurityIdentityId,
      createdAt: Date.now()
    })
  );
  await SecurityStorePrivateKey(SecurityIdentifier, SecurityPrivateKey, 0);
  SecurityClearCache();
  return { username: SecurityIdentifier, deviceId: SecurityDeviceId };
}

async function SecurityAuthenticateAccount(SecurityUsername, SecurityPassword) {
  const SecurityIdentifier = SecurityNormalizeIdentifier(SecurityUsername);
  if (await SecurityIsLocked(SecurityIdentifier)) {
    throw new Error("SecurityIdentifierLocked");
  }
  const SecurityDb = await SecurityOpenDatabase();
  const SecurityStore = SecurityTransactionStore(SecurityDb, "Identities", "readonly");
  const SecurityRecord = await SecurityRequestToPromise(SecurityStore.get(SecurityIdentifier));
  if (!SecurityRecord) {
    await SecurityDeriveCredentialHash(SecurityPassword, SecurityDummySaltHex);
    await SecurityRecordAttempt(SecurityIdentifier, false);
    await SecurityEvaluateAbuse(SecurityIdentifier);
    throw new Error("SecurityInvalidCredentials");
  }
  const SecurityCandidateHash = await SecurityDeriveCredentialHash(SecurityPassword, SecurityRecord.saltHex);
  const SecurityMatches = SecurityConstantTimeEqual(SecurityCandidateHash, SecurityRecord.credentialHash);
  await SecurityRecordAttempt(SecurityIdentifier, SecurityMatches);
  if (!SecurityMatches) {
    await SecurityEvaluateAbuse(SecurityIdentifier);
    throw new Error("SecurityInvalidCredentials");
  }
  await SecuritySetFlag(SecurityIdentifier, { level: "Clear", lockedUntil: 0, failureCount: 0 });
  return { username: SecurityRecord.username, publicKeyHex: SecurityRecord.publicKeyHex, deviceId: SecurityRecord.deviceId };
}

const EnclaveRepo = "teamhangouts/Hangouts";
const EnclaveBranch = "main";
const EnclaveCdnHost = "https://cdn.jsdelivr.net/gh";
const EnclaveManifestPath = "Releases/Latest.txt";

function EnclaveBaseUrl() {
  return `${EnclaveCdnHost}/${EnclaveRepo}@${EnclaveBranch}/`;
}

function EnclaveManifestUrl() {
  return EnclaveBaseUrl() + EnclaveManifestPath;
}

function EnclaveReleaseUrl(EnclaveReleasePath) {
  return EnclaveBaseUrl() + EnclaveReleasePath;
}

async function EnclaveFetchText(EnclaveUrl) {
  const EnclaveResponse = await fetch(EnclaveUrl, { cache: "no-store" });
  if (!EnclaveResponse.ok) {
    throw new Error(`EnclaveFetchFailed:${EnclaveResponse.status}:${EnclaveUrl}`);
  }
  return EnclaveResponse.text();
}

async function EnclaveFetchManifest() {
  const EnclaveManifestRaw = await EnclaveFetchText(EnclaveManifestUrl());
  const EnclaveReleasePath = EnclaveManifestRaw.trim().split("\n")[0].trim();
  if (!EnclaveReleasePath) {
    throw new Error("EnclaveManifestEmpty");
  }
  return EnclaveReleasePath;
}

async function EnclaveFetchRelease(EnclaveReleasePath) {
  return EnclaveFetchText(EnclaveReleaseUrl(EnclaveReleasePath));
}

function EnclaveSetStatus(EnclaveMessage, EnclaveIsError) {
  const EnclaveStatusNode = document.getElementById("EnclaveStatus");
  EnclaveStatusNode.textContent = EnclaveMessage;
  EnclaveStatusNode.classList.toggle("EnclaveStatusError", Boolean(EnclaveIsError));
}

function EnclaveAppendNode(EnclaveParent, EnclaveNode) {
  if (EnclaveNode.nodeType === Node.ELEMENT_NODE && EnclaveNode.tagName === "SCRIPT") {
    const EnclaveScript = document.createElement("script");
    for (const EnclaveAttribute of Array.from(EnclaveNode.attributes)) {
      EnclaveScript.setAttribute(EnclaveAttribute.name, EnclaveAttribute.value);
    }
    EnclaveScript.textContent = EnclaveNode.textContent;
    EnclaveParent.appendChild(EnclaveScript);
    return;
  }
  EnclaveParent.appendChild(document.importNode(EnclaveNode, true));
}

function EnclaveBoot(EnclaveHtml) {
  const EnclaveParsedDoc = new DOMParser().parseFromString(EnclaveHtml, "text/html");
  document.title = EnclaveParsedDoc.title;
  document.head.innerHTML = "";
  document.body.innerHTML = "";
  for (const EnclaveHeadNode of Array.from(EnclaveParsedDoc.head.childNodes)) {
    EnclaveAppendNode(document.head, EnclaveHeadNode);
  }
  for (const EnclaveBodyNode of Array.from(EnclaveParsedDoc.body.childNodes)) {
    EnclaveAppendNode(document.body, EnclaveBodyNode);
  }
}

let EnclaveDownloadedRelease = null;

async function EnclaveRun() {
  try {
    EnclaveSetStatus("Locating latest release...");
    const EnclaveReleasePath = await EnclaveFetchManifest();
    EnclaveSetStatus("Downloading Hangouts...");
    const EnclaveHtml = await EnclaveFetchRelease(EnclaveReleasePath);
    EnclaveDownloadedRelease = EnclaveHtml;
    EnclaveSetStatus("Hangouts downloaded.");
  } catch (EnclaveError) {
    EnclaveSetStatus("Could not reach Hangouts. Check your connection and try again.", true);
  }
}

EnclaveRun();
